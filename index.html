<!doctype html>
<html lang="tr" class="dark" data-theme="dark" style="background-color:#0B0B0D;color-scheme:dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ListenHub – Gerçek Zamanlı Sosyal Müzik ve Frekans Ağı</title>
    <meta name="description" content="ListenHub – Aynı şarkının aynı saniyesinde buluşan canlı frekans odaları ve senkronize zaman çizelgesiyle gerçek zamanlı sosyal müzik ağı." />

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="application-name" content="ListenHub" />
    <meta name="apple-mobile-web-app-title" content="ListenHub" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#0B0B0D" />
    <meta name="msapplication-navbutton-color" content="#0B0B0D" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#0B0B0D" />

    <!-- Web App Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="mask-icon" href="/icon.svg" color="#22C55E" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="ListenHub – Gerçek Zamanlı Sosyal Müzik ve Frekans Ağı" />
    <meta property="og:description" content="ListenHub – Canlı frekans odaları ve senkronize zaman çizelgesiyle gerçek zamanlı sosyal müzik ağı." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Plus Jakarta Sans (Single Unified Typeface) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Permanent Obsidian Ink Dark Mode Lock (Zero FOUC) -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          root.classList.remove('light');
          root.classList.add('dark');
          root.setAttribute('data-theme', 'dark');
          root.style.colorScheme = 'dark';
          root.style.backgroundColor = '#0B0B0D';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0B0B0D] text-[#F5F5F7] selection:bg-white/20 selection:text-[#F5F5F7] antialiased">
    <div id="root"></div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

    <!-- Pre-paint Theme Sync (Prevents Dark/Light FOUC) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('harmoniq_theme_mode') || 'dark';
          var effective =
            saved === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : saved === 'light'
              ? 'light'
              : 'dark';
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(effective);
          root.setAttribute('data-theme', effective);
          root.style.colorScheme = effective;
        } catch (e) {}
      })();
    </script>

  <body class="selection:bg-purple-500/30 antialiased">
    <div id="root"></div>
